    <span class="pos">${i+1}</span><span class="pdot" style="background:${p.color}"></span>
    <span class="pname" style="flex:1">${p.name}${p.cpu?'<span class="cpu-tag">CPU</span>':""}
      <div class="pprops">${T("townsHeld",propCount(p),monopolyCount(p))}</div></span>
    <span class="pcash">${fmt(netWorth(p))}</span></div>`).join("");
  showModal(`<div class="eyebrow">${T("endOfLine",maxMonths)}</div><h3>${T("wins",ranked[0].name)}</h3>
    <p>${T("finalWorth")}</p>${rows}
    <div class="fact">${tx(G.outro)}</div>
    <div class="btnrow"><button class="btn" id="againBtn">${T("playAgain")}</button></div>`);
  document.getElementById("againBtn").onclick=()=>{hideModal();openSetup();};
  setOverview(true);
}
/* ═══════════ SAVE / LOAD ═══════════ */
const SAVE_KEY="grand-express-save";
let memSave=null,storageOK=true;
function snapshot(){
  return {v:4,lang:LANG,country:G.id,month,maxMonths,turnIdx,dest,spiritHolder,spiritLevel,spiritTurns,spiritRest,spiritStuck,cpuLv,
    players:players.map(p=>({name:p.name,cpu:p.cpu,color:p.color,cash:p.cash,props:p.props,items:p.items,node:p.node,skip:p.skip,extra:p.extra}))};
}
function writeSave(obj){
  const s=JSON.stringify(obj);memSave=s;
  try{localStorage.setItem(SAVE_KEY,s);storageOK=true;}catch(e){storageOK=false;}
}
function readSave(){
  try{const s=localStorage.getItem(SAVE_KEY);if(s)return JSON.parse(s);}catch(e){storageOK=false;}
  try{if(memSave)return JSON.parse(memSave);}catch(e){}
  return null;
}
function clearSave(){memSave=null;try{localStorage.removeItem(SAVE_KEY);}catch(e){}}
function saveGame(silent){
  if(over)return;
  writeSave(snapshot());
  if(!silent)log("💾 "+T("saved"),"gold");
}
const encode=o=>btoa(unescape(encodeURIComponent(JSON.stringify(o))));
const decode=s=>JSON.parse(decodeURIComponent(escape(atob(s.trim()))));
function loadState(st){
  LANG=st.lang||"en";
  G=COUNTRIES[st.country]||BOLIVIA;
  buildGraph();paintEmblem();Snd.reset();
  applyLang(false);
  month=st.month;maxMonths=st.maxMonths;turnIdx=st.turnIdx;dest=st.dest;
  spiritHolder=st.spiritHolder;spiritLevel=st.spiritLevel;spiritTurns=st.spiritTurns||0;spiritRest=!!st.spiritRest;spiritStuck=st.spiritStuck||0;
  cpuLv=st.cpuLv===undefined?1:st.cpuLv;
  players=st.players.map(p=>({...p,props:p.props||{},items:p.items||[]}));
  over=false;quizBag=[];showNames=false;
  resetMod();
  const ev=G.seasons[month%12];showSeasonCard(ev,ev.run());
  logEl.innerHTML="";
  drawBoard();renderTokens();markDest();markOwned();setDestCard();refreshPlayers();
  CAM.w=BW;CAM.x=0;CAM.y=0;applyCam();setOverview(false);
  focusNode(players[turnIdx].node,FOLLOW_W,0);
  Snd.start();Snd.region(nodes[players[turnIdx].node].reg);
  log("💾 "+T("resumed"),"gold");
  gameLoop();
}
function openSaveDialog(){
  saveGame(true);
  showModal(`<div class="eyebrow">${T("save")}</div><h3>${T("saveTitle")}</h3>
    <p>${storageOK?T("saveBody"):T("saveFail")}</p>
    <textarea class="save" id="saveTxt" spellcheck="false">${memSave?encode(JSON.parse(memSave)):""}</textarea>
    <div class="btnrow"><button class="btn" id="loadCode">${T("loadCode")}</button>
    <button class="btn ghost" id="svClose">${T("close")}</button></div>`);
  document.getElementById("loadCode").onclick=()=>{
    try{const st=decode(document.getElementById("saveTxt").value);hideModal();loadState(st);}
    catch(e){alert(T("badCode"));}
  };
  document.getElementById("svClose").onclick=hideModal;
}
document.getElementById("saveBtn").onclick=openSaveDialog;

/* ═══════════ SETUP ═══════════ */
let setupRender=null;
function openSetup(){
  over=true;dieBtn.disabled=true;itemHandler=null;showSeasonCard(null);
  let country=G.id;
  let slots=null,months=12,lv=1;
  const saved=readSave();
  const makeSlots=co=>[{name:"You",mode:"human"},{name:co.cpuNames[0],mode:"cpu"},{name:co.cpuNames[1],mode:"cpu"},{name:co.cpuNames[2],mode:"off"}];
  slots=makeSlots(COUNTRIES[country]);
  function render(){
    const co=COUNTRIES[country];
    showModal(`<div class="eyebrow">${T("newJourney")}</div><h3>${T("setupTitle")}</h3>
      ${saved?`<div class="btnrow" style="margin:0 0 14px"><button class="btn" id="resumeBtn" style="width:100%">${T("resume")}</button></div>`:""}
      <div class="eyebrow" style="margin-top:4px">${T("chooseCountry")}</div>
      <div class="countries">${Object.values(COUNTRIES).map(c=>`
        <button class="ccard ${c.id===country?"on":""}" data-c="${c.id}">
          <div class="thumb">${countryThumb(c)}</div>
          <div class="cap"><div class="nm">${tx(c.name)}</div><div class="sub">${tx(c.blurb)}</div></div>
        </button>`).join("")}</div>
      <p style="color:var(--salt-dim);font-size:.9rem;margin-bottom:12px">${T("setupSub")}</p>
      ${slots.map((s,i)=>`<div class="slot">
        <span class="pdot" style="background:${P_COLORS[i]}"></span>
        <input value="${s.name}" data-i="${i}" maxlength="16">
        <div class="seg" data-i="${i}">
          <button data-m="human" class="${s.mode==="human"?"on":""}">${T("human")}</button>
          <button data-m="cpu" class="${s.mode==="cpu"?"on":""}">CPU</button>
          <button data-m="off" class="${s.mode==="off"?"on":""}" ${i<2?"disabled style='opacity:.35'":""}>${T("off")}</button>
        </div></div>`).join("")}
      <div class="slot" style="margin-top:14px">
        <span style="font-weight:800;font-size:.9rem;flex:1">${T("length")}</span>
        <div class="seg" id="mSeg">
          <button data-m="12" class="${months===12?"on":""}">${T("y1")}</button>
          <button data-m="24" class="${months===24?"on":""}">${T("y2")}</button>
          <button data-m="36" class="${months===36?"on":""}">${T("y3")}</button>
        </div></div>
      <div class="slot">
        <span style="font-weight:800;font-size:.9rem;flex:1">${T("cpuLevel")}</span>
        <div class="seg" id="lvSeg">
          <button data-v="0" class="${lv===0?"on":""}">${T("lvEasy")}</button>
          <button data-v="1" class="${lv===1?"on":""}">${T("lvNormal")}</button>
          <button data-v="2" class="${lv===2?"on":""}">${co.spirit.e} ${T("lvOni")}</button>
        </div></div>
      <div class="rules">${T("rules")}<br><br>${T("rulesCam")}</div>
      <div class="btnrow"><button class="btn" id="startBtn" style="width:100%">${T("start")}</button></div>`);
    modalBox.querySelectorAll(".ccard").forEach(b=>b.onclick=()=>{
      if(country===b.dataset.c)return;
      country=b.dataset.c;
      const co2=COUNTRIES[country],fresh=makeSlots(co2);
      slots=slots.map((s,i)=>({name:fresh[i].name,mode:s.mode}));
      if(slots[0].mode==="human")slots[0].name="You";
      render();
    });
    modalBox.querySelectorAll(".slot input").forEach(inp=>inp.onchange=()=>{slots[+inp.dataset.i].name=inp.value.trim()||("P"+(+inp.dataset.i+1));});
    modalBox.querySelectorAll(".seg[data-i] button").forEach(b=>b.onclick=()=>{if(b.disabled)return;slots[+b.parentElement.dataset.i].mode=b.dataset.m;render();});
    modalBox.querySelectorAll("#mSeg button").forEach(b=>b.onclick=()=>{months=+b.dataset.m;render();});
    modalBox.querySelectorAll("#lvSeg button").forEach(b=>b.onclick=()=>{lv=+b.dataset.v;render();});
    const rb=document.getElementById("resumeBtn");
    if(rb)rb.onclick=()=>{Snd.start();hideModal();loadState(saved);};
    document.getElementById("startBtn").onclick=()=>{
      const active=slots.filter(s=>s.mode!=="off");
      Snd.start();clearSave();hideModal();
      startGame({country,months,cpuLv:lv,players:active.map(s=>({name:s.name,cpu:s.mode==="cpu"}))});
    };
  }
  setupRender=render;
  render();
}
document.getElementById("newGameBtn").onclick=()=>{over=true;openSetup();};
document.getElementById("locateBtn").onclick=e=>{
  showNames=!showNames;
  e.currentTarget.classList.toggle("on",showNames);
  e.currentTarget.textContent=showNames?T("hideAll"):T("showAll");
  renderTokens();flashTokens();
  if(players.length)fitNodes(players.map(p=>p.node),170,600);
};
document.getElementById("assetsBtn").onclick=openAssets;

/* ═══════════ LANGUAGE SWITCH ═══════════ */
function applyLang(redraw){
  document.documentElement.lang=LANG;
  document.querySelectorAll("[data-i18n]").forEach(e=>{e.innerHTML=T(e.dataset.i18n);});
  document.querySelectorAll("#langSeg button").forEach(b=>b.classList.toggle("on",b.dataset.l===LANG));
  document.getElementById("locateBtn").textContent=showNames?T("hideAll"):T("showAll");
  document.getElementById("assetsBtn").textContent=T("myBiz");
  document.getElementById("dieHint").textContent=T("tapStop");
  document.getElementById("countryChip").textContent=tx(G.name);
  if(redraw!==false){
    drawBoard();applyCam();
    if(players.length){
      renderTokens();markDest();markOwned();setDestCard();refreshPlayers();
      if(!over){
        const ev=G.seasons[month%12];showSeasonCard(ev,seasonEffect||ev.run());
        document.getElementById("turnName").textContent=T("turnOf",players[turnIdx].name);
        camWho(players[turnIdx].name);
      }
    }
  }
  if(overview)document.getElementById("camBadge").innerHTML=T("overview");
  if(over&&setupRender&&overlay.classList.contains("show"))setupRender();
}
document.querySelectorAll("#langSeg button").forEach(b=>b.onclick=()=>{LANG=b.dataset.l;applyLang(true);});

/* init — a stray reload picks the journey back up where it stopped */
(function boot(){
  const st=readSave();
  if(st&&st.players&&st.players.length&&COUNTRIES[st.country]){
    LANG=st.lang||LANG;
    try{ loadState(st); return; }catch(e){ clearSave(); }
  }
  buildGraph();paintEmblem();applyLang(false);
  drawBoard();applyCam();openSetup();
})();
</script>
</body>
