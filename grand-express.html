<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grand Express — A Rail Fortune Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Archivo:wght@400;600;800&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --night:#241a3f; --night2:#1b1330; --panel:#2f2455; --panel2:#3a2d66; --line:#4a3b7d;
  --salt:#f6efe2; --salt-dim:#cfc4b0;
  --pink:#e8447a; --gold:#f5b31c; --teal:#37b3a4; --green:#7bc86c; --red:#e05252; --blue:#5b8fe8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Archivo','Noto Sans JP',system-ui,sans-serif;
  background:radial-gradient(1200px 600px at 70% -10%, #35276360 0%, transparent 60%), var(--night);
  color:var(--salt);min-height:100vh;display:flex;flex-direction:column}
button{font-family:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--gold);outline-offset:2px}

header{border-bottom:6px solid transparent;background:var(--night2);padding:10px 18px 12px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.emblem{display:grid;grid-template-columns:repeat(4,9px);grid-auto-rows:9px;transform:rotate(45deg);flex:none}
.emblem i{display:block}
h1{font-family:'Alfa Slab One',serif;font-weight:400;font-size:clamp(1.15rem,2.8vw,1.75rem);
  color:var(--gold);text-shadow:3px 3px 0 #00000055;line-height:1}
h1 small{display:block;font-family:'Archivo','Noto Sans JP';font-weight:600;font-size:.68rem;letter-spacing:.2em;
  color:var(--salt-dim);text-transform:uppercase;margin-top:4px}
.hdr-right{margin-left:auto;display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.date-chip{background:var(--panel2);border:1px solid var(--line);padding:6px 13px;border-radius:999px;font-weight:800;font-size:.88rem}
.date-chip b{color:var(--gold)}
.date-chip .season{color:var(--teal);font-size:.82rem}
.langseg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.langseg button{background:var(--night2);color:var(--salt-dim);border:none;padding:7px 10px;font-weight:800;font-size:.74rem}
.langseg button.on{background:var(--gold);color:var(--night2)}

main{flex:1;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(310px,430px);gap:16px;padding:16px;max-width:1620px;width:100%;margin:0 auto}
@media (max-width:940px){main{grid-template-columns:1fr}}

.board-wrap{background:#141d31;border:1px solid var(--line);border-radius:18px;padding:8px;position:relative;
  box-shadow:0 20px 50px #00000050;overflow:hidden}
svg#board{width:100%;height:auto;display:block;touch-action:none;cursor:grab;border-radius:12px}
svg#board.dragging{cursor:grabbing}
.cam{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:6px;z-index:3}
.cam button{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#1b1330d9;
  color:var(--salt);font-size:1.15rem;font-weight:800;display:grid;place-items:center;backdrop-filter:blur(4px)}
.cam button.on{background:var(--gold);color:var(--night2)}
.badge{position:absolute;left:16px;top:16px;background:#1b1330d9;border:1px solid var(--line);
  border-radius:10px;padding:7px 12px;font-size:.8rem;color:var(--salt-dim);z-index:3;backdrop-filter:blur(4px)}
.badge b{color:var(--gold)}

.city-label{font-family:'Archivo','Noto Sans JP';font-weight:800;font-size:15px;fill:var(--salt);paint-order:stroke;stroke:#0e1626;stroke-width:4.5px}
.legend{font-size:13px;fill:#e8e0cf;font-weight:600}
.node.choosable{cursor:pointer}
.node.choosable .halo{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:.3;r:20}50%{opacity:.9;r:30}}
.dest-ring{animation:destspin 3.4s linear infinite}
@keyframes destspin{to{transform:rotate(360deg)}}
.token{transition:transform .2s ease}
@keyframes ping{0%{r:14;opacity:.95}100%{r:52;opacity:0}}
.ping{animation:ping 1.1s ease-out 2 both}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

aside{display:flex;flex-direction:column;gap:13px;min-width:0}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:13px 15px;box-shadow:0 10px 30px #00000035}
.card h2{font-family:'Alfa Slab One';font-weight:400;font-size:.78rem;letter-spacing:.13em;color:var(--salt-dim);
  text-transform:uppercase;margin-bottom:9px}
.dest-card{background:linear-gradient(135deg,#3a2d66,#2f2455);position:relative;overflow:hidden}
.dest-card .emblem{position:absolute;right:-14px;top:-14px;opacity:.45}
.dest-city{font-family:'Alfa Slab One','Noto Sans JP';font-size:1.55rem;color:var(--gold);line-height:1.05;position:relative}
.dest-tag{color:var(--salt-dim);font-size:.87rem;margin-top:3px}
.dest-bonus{margin-top:9px;display:inline-block;background:#f5b31c22;border:1px dashed var(--gold);color:var(--gold);
  font-weight:800;padding:5px 12px;border-radius:8px;font-size:.9rem}
.dest-thumb{border-radius:10px;overflow:hidden;border:1px solid var(--line);margin-top:11px;line-height:0}
.dest-thumb svg{display:block;width:100%;height:auto}

.season-card{display:flex;gap:11px;align-items:flex-start;background:#37b3a41a;border-color:var(--teal)}
.season-card .e{font-size:1.6rem;line-height:1}
.season-card .nm{font-weight:800;color:var(--teal);font-size:.98rem}
.season-card .sub{color:var(--salt-dim);font-size:.87rem;margin-top:3px;line-height:1.45}

.turn-row{display:flex;align-items:center;gap:14px}
#die{width:74px;height:74px;border-radius:16px;border:none;flex:none;background:var(--salt);color:var(--night2);
  font-size:2.9rem;line-height:1;font-family:'Alfa Slab One';display:grid;place-items:center;
  box-shadow:0 6px 0 #b9ad97,0 14px 24px #00000045;transition:transform .1s}
#die:not(:disabled):hover{transform:translateY(-2px)}
#die:disabled{opacity:.55;cursor:default;box-shadow:0 3px 0 #b9ad97}
#die.rolling{animation:shake .4s infinite}
@keyframes shake{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.turn-name{font-weight:800;font-size:1.1rem}
.turn-hint{color:var(--salt-dim);font-size:.92rem;margin-top:3px;line-height:1.4}
.sidebtns{display:flex;gap:8px;margin-top:11px}
.sidebtns .btn{flex:1;background:var(--panel2);color:var(--salt);box-shadow:none;border:1px solid var(--line);
  font-size:.9rem;padding:10px 8px}
.sidebtns .btn.on{background:var(--gold);color:var(--night2);border-color:var(--gold)}

.items{display:flex;flex-wrap:wrap;gap:7px}
.item{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line);
  border-radius:9px;padding:8px 11px;font-size:.88rem;font-weight:700;color:var(--salt)}
.item.usable{border-color:var(--gold);cursor:pointer}
.item.usable:hover{background:#f5b31c22}
.item .e{font-size:1.15rem}
.item.passive{opacity:.85;border-style:dashed}
.empty{color:var(--salt-dim);font-size:.88rem}

.players{display:flex;flex-direction:column;gap:8px}
.prow{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:9px 11px;font-size:.95rem}
.prow.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold),0 0 18px #f5b31c33}
.pdot{width:14px;height:14px;border-radius:50%;flex:none;border:2px solid #1b1330}
.pname{font-weight:800;flex:1;min-width:0}
.pname .cpu-tag{font-size:.68rem;background:#00000040;padding:2px 6px;border-radius:5px;color:var(--salt-dim);margin-left:6px}
.pcash{font-weight:800;color:var(--green);font-size:1rem}
.pprops{color:var(--salt-dim);font-size:.82rem;font-weight:400;margin-top:2px}
.ploc{color:var(--salt);font-size:.82rem;font-weight:600;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crown{color:var(--gold)}

#log{max-height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:7px;font-size:.92rem;line-height:1.45}
#log p{border-left:3px solid var(--line);padding-left:8px;color:var(--salt-dim)}
#log p b{color:var(--salt)}
#log p.good{border-color:var(--green)} #log p.bad{border-color:var(--red)}
#log p.gold{border-color:var(--gold);color:var(--salt)}
#log p.tio{border-color:#a03060;color:#f0b8c8}
#log p.season{border-color:var(--teal);color:#bfe8e2}

.dice-stage{position:absolute;inset:0;z-index:5;display:none;perspective:1000px}
.dice-stage.on{display:block}
.dice-stage.tappable{cursor:pointer}
.die3d{position:absolute;left:0;top:0;width:96px;height:96px;transform-style:preserve-3d;will-change:transform}
.die3d .f{position:absolute;inset:0;background:linear-gradient(150deg,#fffdf5,#e4d9be);
  border-radius:17px;border:2px solid #c8b894;box-shadow:inset 0 0 26px #cbbb98, inset 0 6px 10px #ffffffcc;
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:13px;backface-visibility:hidden}
.die3d .f i{width:17px;height:17px;border-radius:50%;align-self:center;justify-self:center;
  background:radial-gradient(circle at 35% 30%,#5a4630,#241a10 70%);box-shadow:inset 0 -2px 3px #00000070}
.die-shadow{position:absolute;border-radius:50%;background:#000;filter:blur(7px);opacity:.3}
.die-hint{position:absolute;left:50%;bottom:26px;transform:translateX(-50%);background:#1b1330e6;
  border:1px solid var(--line);padding:9px 20px;border-radius:999px;font-weight:800;font-size:.82rem;
  color:var(--gold);letter-spacing:.1em;white-space:nowrap}
.die-result{position:absolute;left:50%;top:44%;opacity:0;transform:translate(-50%,-50%) scale(.4);
  font-family:'Alfa Slab One';font-size:5.4rem;color:var(--gold);text-shadow:0 7px 0 #00000066,0 0 40px #f5b31c66;pointer-events:none}
.die-result.show{opacity:1;transform:translate(-50%,-50%) scale(1);animation:resPop .5s ease}
@keyframes resPop{0%{transform:translate(-50%,-50%) scale(.4);opacity:0}45%{transform:translate(-50%,-50%) scale(1.3);opacity:1}}

#turnBanner{position:fixed;inset:0;z-index:60;display:none;pointer-events:none;overflow:hidden}
#turnBanner.on{display:block}
#turnBanner .band{position:absolute;left:-12%;top:38%;width:124%;padding:26px 0;
  background:linear-gradient(90deg,transparent,var(--bandc) 12%,var(--bandc) 88%,transparent);
  transform:skewY(-3.5deg) translateX(-115%);box-shadow:0 20px 60px #00000070}
#turnBanner.go .band{animation:bandIn 1.5s cubic-bezier(.2,.9,.25,1) forwards}
@keyframes bandIn{0%{transform:skewY(-3.5deg) translateX(-115%)}22%{transform:skewY(-3.5deg) translateX(0)}
  74%{transform:skewY(-3.5deg) translateX(0)}100%{transform:skewY(-3.5deg) translateX(115%)}}
#turnBanner .inner{text-align:center;transform:skewY(3.5deg)}
#turnBanner .who{font-family:'Alfa Slab One','Noto Sans JP';font-size:clamp(1.8rem,6vw,3.4rem);
  color:#1b1330;text-shadow:0 3px 0 #ffffff66;line-height:1.05}
#turnBanner .sub{font-weight:800;letter-spacing:.3em;font-size:.85rem;color:#1b1330b0;text-transform:uppercase;margin-top:6px}

#overlay{position:fixed;inset:0;background:#120c24cc;backdrop-filter:blur(3px);display:none;place-items:center;padding:16px;z-index:50}
#overlay.show{display:grid}
.modal{width:min(680px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;
  padding:22px 24px;box-shadow:0 30px 80px #000000aa;position:relative;border-top:6px solid transparent;
  animation:pop .18s ease;max-height:92vh;overflow-y:auto}
.modal.doom{background:#33203f}
@keyframes pop{from{transform:scale(.94);opacity:0}}
.modal .eyebrow{font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--salt-dim);font-weight:800;margin-bottom:6px}
.modal h3{font-family:'Alfa Slab One','Noto Sans JP';font-weight:400;font-size:1.65rem;color:var(--gold);line-height:1.2;margin-bottom:11px}
.modal p{color:var(--salt);line-height:1.62;font-size:1.02rem}
.modal .fact{background:#00000030;border-left:4px solid var(--teal);padding:12px 14px;border-radius:0 8px 8px 0;
  margin-top:13px;font-size:.97rem;line-height:1.58;color:var(--salt-dim)}
.modal .fact b{color:var(--teal)}
.art{width:100%;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#1b1330;
  margin-bottom:13px;box-shadow:0 10px 26px #00000055;line-height:0}
.art svg{display:block;width:100%;height:auto}
.btnrow{display:flex;gap:9px;margin-top:16px;flex-wrap:wrap}
.btn{border:none;border-radius:10px;padding:12px 19px;font-weight:800;font-size:1rem;background:var(--gold);
  color:var(--night2);box-shadow:0 4px 0 #b8850f;transition:transform .1s}
.btn:hover{transform:translateY(-1px)}
.btn.ghost{background:var(--panel2);color:var(--salt);box-shadow:0 4px 0 #221840;border:1px solid var(--line)}
.btn.opt{width:100%;text-align:left;background:var(--panel2);color:var(--salt);box-shadow:none;
  border:1px solid var(--line);font-size:1.04rem;padding:14px 17px;line-height:1.42}
.btn.opt:hover{border-color:var(--gold)}
.btn.opt.correct{background:#7bc86c33;border-color:var(--green);color:var(--green)}
.btn.opt.wrong{background:#e0525233;border-color:var(--red);color:var(--red)}
.btn:disabled{opacity:.6;cursor:default;transform:none}
.money{color:var(--green);font-weight:800}
.money.neg{color:var(--red)}

.plist{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.prop{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:10px 12px;flex-wrap:wrap}
.prop .info{flex:1;min-width:150px}
.prop .nm{font-weight:800;font-size:.99rem}
.prop .sub{color:var(--salt-dim);font-size:.85rem;margin-top:2px;line-height:1.4}
.prop .lv{display:inline-block;background:var(--gold);color:var(--night2);font-weight:800;font-size:.72rem;
  padding:2px 7px;border-radius:6px;margin-left:6px;vertical-align:1px}
.prop button{border:none;border-radius:8px;padding:9px 13px;font-weight:800;font-size:.88rem;
  background:var(--gold);color:var(--night2);white-space:nowrap}
.prop button.up{background:var(--teal);color:#10231f}
.prop button.sell{background:var(--panel);color:var(--salt-dim);border:1px solid var(--line)}
.prop button:disabled{background:#00000030;color:var(--salt-dim);cursor:default;border:none}
.prop.owned{border-style:dashed}
.monopoly{margin-top:11px;background:#f5b31c1f;border:1px dashed var(--gold);border-radius:10px;
  padding:10px 13px;font-size:.93rem;color:var(--gold);font-weight:700}
.shop{margin-top:14px;background:#37b3a41a;border:1px solid var(--teal);border-radius:10px;padding:12px 14px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.shop .e{font-size:1.8rem}
.shop .info{flex:1;min-width:150px}
.shop .nm{font-weight:800}
.shop .sub{color:var(--salt-dim);font-size:.85rem;margin-top:2px;line-height:1.4}
.shop button{border:none;border-radius:8px;padding:9px 14px;font-weight:800;background:var(--teal);color:#10231f;white-space:nowrap}
.shop button:disabled{background:#00000030;color:var(--salt-dim);cursor:default}

.cashbar{display:flex;align-items:center;gap:10px;background:#7bc86c1a;border:1px solid var(--green);
  border-radius:10px;padding:9px 13px;margin:12px 0 2px;font-weight:800;font-size:.95rem;flex-wrap:wrap}
.cashbar .lbl{color:var(--salt-dim);font-weight:600;font-size:.85rem}
.cashbar .v{color:var(--green);font-size:1.1rem}
.dist-chip{margin-top:9px;display:inline-block;background:#37b3a422;border:1px dashed var(--teal);color:var(--teal);
  font-weight:800;padding:5px 12px;border-radius:8px;font-size:.9rem;margin-left:6px}
.pdist{color:var(--teal);font-weight:800;font-size:.82rem;white-space:nowrap}
.roul{margin:18px 0 4px;text-align:center;background:#00000035;border-radius:14px;padding:20px 12px;border:1px solid var(--line)}
.roul .num{font-family:'Alfa Slab One';font-size:clamp(2.4rem,10vw,4rem);line-height:1.05}
.roul .num.up{color:var(--green)} .roul .num.down{color:var(--red)}
.roul .cap{font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;color:var(--salt-dim);font-weight:800;margin-bottom:8px}
.roul.settled .num{animation:resPop .45s ease}
.itemcard{display:flex;gap:14px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);
  border-radius:12px;padding:14px;margin-top:6px}
.itemcard .e{font-size:2.4rem;line-height:1}
.itemcard .nm{font-weight:800;font-size:1.1rem}
.itemcard .sub{color:var(--salt-dim);font-size:.94rem;margin-top:4px;line-height:1.5}
.shoplist{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.slot{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap}
.slot input{flex:1;background:var(--night2);border:1px solid var(--line);border-radius:8px;color:var(--salt);
  padding:10px 13px;font-family:inherit;font-size:.98rem;min-width:110px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex:none}
.seg button{background:var(--night2);color:var(--salt-dim);border:none;padding:10px 12px;font-weight:800;font-size:.84rem}
.seg button.on{background:var(--gold);color:var(--night2)}
.countries{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:4px 0 16px}
.ccard{background:var(--night2);border:2px solid var(--line);border-radius:14px;padding:0;overflow:hidden;
  text-align:left;color:var(--salt);position:relative}
.ccard.on{border-color:var(--gold);box-shadow:0 0 22px #f5b31c33}
.ccard .thumb{line-height:0;background:#141d31}
.ccard .thumb svg{display:block;width:100%;height:auto}
.ccard .cap{padding:9px 12px 11px}
.ccard .nm{font-weight:800;font-size:1.02rem}
.ccard .sub{color:var(--salt-dim);font-size:.8rem;margin-top:2px;line-height:1.35}
.rules{font-size:.94rem;color:var(--salt-dim);line-height:1.65;margin-top:12px;border-top:1px solid var(--line);padding-top:12px}
.rules b{color:var(--salt)}
.rank{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);
  border-radius:10px;padding:10px 14px;margin-top:8px}
.rank .pos{font-family:'Alfa Slab One';font-size:1.3rem;color:var(--salt-dim);width:34px}
.rank.first{border-color:var(--gold);box-shadow:0 0 20px #f5b31c33}
.rank.first .pos{color:var(--gold)}
.dicepick{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:14px}
.dicepick button{background:var(--salt);color:var(--night2);border:none;border-radius:10px;padding:12px 0;
  font-size:1.6rem;font-family:'Alfa Slab One';box-shadow:0 4px 0 #b9ad97}
textarea.save{width:100%;height:110px;background:var(--night2);border:1px solid var(--line);border-radius:10px;
  color:var(--salt-dim);padding:11px;font-family:monospace;font-size:.8rem;margin-top:12px;resize:vertical}
footer{padding:10px 20px 16px;text-align:center;color:#7a6da8;font-size:.75rem}
</style>
</head>
<body>

<header id="hdr">
  <div class="emblem" id="emblem-hdr" aria-hidden="true"></div>
  <h1>GRAND EXPRESS<small data-i18n="tagline">A rail fortune game</small></h1>
  <div class="hdr-right">
    <span class="date-chip"><span id="countryChip">—</span> · <span data-i18n="year">Year</span> <b id="yearNow">1</b> · <span id="monthNow">April</span>
      <span class="season" id="seasonNow"></span></span>
    <div class="langseg" id="langSeg">
      <button data-l="en">EN</button><button data-l="es">ES</button><button data-l="fr">FR</button><button data-l="ja">日本語</button>
    </div>
    <button class="btn ghost" id="musicBtn" style="padding:7px 12px;font-size:.78rem">♪</button>
    <button class="btn ghost" id="saveBtn" style="padding:7px 12px;font-size:.78rem" data-i18n="save">Save</button>
    <button class="btn ghost" id="newGameBtn" style="padding:7px 12px;font-size:.78rem" data-i18n="newGame">New game</button>
  </div>
</header>

<main>
  <div class="board-wrap">
    <div class="badge" id="camBadge">—</div>
    <svg id="board" viewBox="0 0 1200 1400" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Game map"></svg>
    <div class="cam">
      <button id="zoomIn" title="Zoom in" aria-label="Zoom in">＋</button>
      <button id="zoomOut" title="Zoom out" aria-label="Zoom out">－</button>
      <button id="overviewBtn" title="Whole map" aria-label="Show whole map">🗺</button>
    </div>
    <div class="dice-stage" id="diceStage" aria-hidden="true">
      <div class="die-shadow" id="dieShadow"></div>
      <div class="die3d" id="die3d"></div>
      <div class="die-result" id="dieResult"></div>

BOLIVIA.spirit={
 e:"👹", n:_t("El Tío|El Tío|El Tío|エル・ティーオ"), big:_t("El Tío Rey|El Tío Rey|El Tío Rey|エル・ティーオ・レイ"),
 arrive:_t("<b>👹 El Tío boards the rails!</b> In the tunnels of Potosí, miners honour El Tío — lord of the underworld — with cigarettes, coca and alcohol so that he protects rather than punishes. He now rides with <b>{0}</b>, the traveler farthest from the destination, and brings a disaster every turn.|<b>👹 ¡El Tío sube al tren!</b> En los túneles de Potosí los mineros honran a El Tío — señor del subsuelo — con cigarrillos, coca y alcohol para que proteja en vez de castigar. Ahora viaja con <b>{0}</b>, el más lejano del destino, y trae un desastre cada turno.|<b>👹 El Tío monte à bord !</b> Dans les galeries de Potosí, les mineurs honorent El Tío — maître du sous-sol — de cigarettes, de coca et d'alcool pour qu'il protège au lieu de punir. Il voyage désormais avec <b>{0}</b>, le plus éloigné de la destination, et apporte un désastre à chaque tour.|<b>👹 エル・ティーオが乗り込んできた!</b> ポトシの坑道では、鉱夫たちが地下の主エル・ティーオにタバコ・コカ・酒を捧げ、罰ではなく加護を願います。目的地から最も遠い <b>{0}</b> に取り憑き、毎ターン災難をもたらします。"),
 moves:_t("👹 <b>El Tío</b> changes trains — he now rides with <b>{0}</b>, farthest from {1}.|👹 <b>El Tío</b> cambia de tren — ahora viaja con <b>{0}</b>, el más lejos de {1}.|👹 <b>El Tío</b> change de train — il voyage maintenant avec <b>{0}</b>, le plus loin de {1}.|👹 <b>エル・ティーオ</b> が乗り換えた — {1} から最も遠い <b>{0}</b> に憑いた。"),
 wake:_t("<b>{0}</b> has carried El Tío for four turns without shaking him off. His horns grow, his lamp burns green, and from now on every disaster strikes twice as hard.|<b>{0}</b> lleva cuatro turnos con El Tío encima. Sus cuernos crecen, su lámpara arde verde, y desde ahora cada desastre golpea el doble.|<b>{0}</b> porte El Tío depuis quatre tours sans s'en défaire. Ses cornes poussent, sa lampe brûle vert, et désormais chaque désastre frappe deux fois plus fort.|<b>{0}</b> は4ターン連続でエル・ティーオを振り払えなかった。角は伸び、ランプは緑に燃え、これ以降の災難は2倍の威力に。"),
 wakeFact:_t("<b>Behind the story:</b> Miners in Cerro Rico say El Tío owns everything below ground. Leave him coca, cigarettes and alcohol and he lets you work; forget him, and the mountain takes its due.|<b>Detrás del relato:</b> Los mineros del Cerro Rico dicen que El Tío es dueño de todo lo subterráneo. Déjale coca, cigarrillos y alcohol y te deja trabajar; olvídalo y la montaña cobra lo suyo.|<b>Derrière le récit :</b> Les mineurs du Cerro Rico disent qu'El Tío possède tout ce qui est sous terre. Laissez-lui coca, cigarettes et alcool et il vous laisse travailler ; oubliez-le, et la montagne prend son dû.|<b>背景:</b> セロ・リコの鉱夫たちは、地下の一切はエル・ティーオのものだと言います。コカ・タバコ・酒を捧げれば働かせてくれ、忘れれば山が代償を取り立てます。"),
 ward:"coca",
 wardBody:_t("A fistful of green leaves lands at his feet. El Tío grunts, takes it, and lets <b>{0}</b> pass untouched this turn.|Un puñado de hojas verdes cae a sus pies. El Tío gruñe, las toma y deja pasar a <b>{0}</b> sin tocarlo.|Une poignée de feuilles vertes tombe à ses pieds. El Tío grogne, les prend et laisse passer <b>{0}</b> sans y toucher.|緑の葉をひとつかみ差し出すと、エル・ティーオは唸りながら受け取り、今回は <b>{0}</b> を見逃した。"),
 pleased:_t("Something in the offerings satisfies him. A vein glitters where nobody had looked — <b>{0}</b> gains <span class='money'>+{1}</span>.|Algo en las ofrendas le agrada. Una veta brilla donde nadie miró — <b>{0}</b> gana <span class='money'>+{1}</span>.|Quelque chose dans les offrandes lui plaît. Un filon brille là où nul n'avait regardé — <b>{0}</b> gagne <span class='money'>+{1}</span>.|供物が気に入ったらしい。誰も見ていなかった場所に鉱脈が光る — <b>{0}</b> は <span class='money'>+{1}</span> を得た。"),
};
BOLIVIA.doom=[
 {id:"offering",n:_t("El Tío demands his offering|El Tío exige su ofrenda|El Tío exige son offrande|エル・ティーオが供物を要求"),
  t:_t("El Tío's stone hand closes over the ore cart. Nothing moves until cigarettes, coca and pure alcohol are laid at his feet.|La mano de piedra de El Tío aprieta el carro de mineral. Nada se mueve hasta que le dejen cigarrillos, coca y alcohol puro.|La main de pierre d'El Tío se referme sur le wagonnet. Rien ne bouge tant qu'on ne dépose pas cigarettes, coca et alcool pur à ses pieds.|エル・ティーオの石の手が鉱車を押さえる。タバコ・コカ・純アルコールを足元に供えるまで、何ひとつ動かない。"),
  run:(p,k)=>{const v=Math.min(p.cash,(k?420:150)+rnd(k?420:160));p.cash-=v;
    return {e:`pays <span class="money neg">−${fmt(v)}</span> in offerings`,s:`paga <span class="money neg">−${fmt(v)}</span> en ofrendas`,f:`paie <span class="money neg">−${fmt(v)}</span> en offrandes`,j:`供物に <span class="money neg">−${fmt(v)}</span> を支払った`};}},
 {id:"collapse",n:_t("Cave-in in the tunnel|Derrumbe en el túnel|Éboulement dans la galerie|坑道の落盤"),
  t:_t("Timbers crack somewhere above. The shaft fills with dust and the day's takings are buried with it.|Cruje la madera arriba. El pozo se llena de polvo y la ganancia del día queda enterrada.|Les étais craquent quelque part au-dessus. Le puits s'emplit de poussière et la recette du jour est ensevelie.|頭上で坑木が裂ける。竪坑は粉塵で満たされ、その日の売上も一緒に埋まった。"),
  run:(p,k)=>{const v=Math.round(p.cash*(k?0.32:0.14));p.cash-=v;
    return {e:`loses <span class="money neg">−${fmt(v)}</span> under the rubble`,s:`pierde <span class="money neg">−${fmt(v)}</span> bajo los escombros`,f:`perd <span class="money neg">−${fmt(v)}</span> sous les gravats`,j:`瓦礫の下に <span class="money neg">−${fmt(v)}</span> を失った`};}},
 {id:"bloqueo",n:_t("Bloqueo on the highway|Bloqueo en la carretera|Blocage sur la route|幹線道路の封鎖"),
  t:_t("Boulders and burning tyres close the road. Nobody passes today — a very Bolivian kind of standstill.|Piedras y neumáticos ardiendo cierran la ruta. Hoy no pasa nadie: un atasco muy boliviano.|Des rochers et des pneus en flammes ferment la route. Personne ne passe aujourd'hui — un blocage très bolivien.|岩と燃えるタイヤが道を塞ぐ。今日は誰も通れない。実にボリビアらしい足止めだ。"),
  run:(p,k)=>{p.skip=true;
    if(k){const v=Math.min(p.cash,300);p.cash-=v;
      return {e:`misses a turn and pays <span class="money neg">−${fmt(v)}</span> in spoiled cargo`,s:`pierde un turno y paga <span class="money neg">−${fmt(v)}</span> en carga podrida`,f:`perd un tour et paie <span class="money neg">−${fmt(v)}</span> de marchandise avariée`,j:`1回休み、腐った積荷で <span class="money neg">−${fmt(v)}</span> の損`};}
    return {e:"misses the next turn",s:"pierde el próximo turno",f:"perd le tour suivant",j:"次の手番を1回休み"};}},
 {id:"landslide",n:_t("Landslide takes a business|Un derrumbe se lleva un negocio|Un glissement emporte une affaire|地滑りが物件を飲み込む"),
  t:_t("The hillside slides in the night and takes a whole enterprise down with it.|La ladera se desliza en la noche y arrastra un negocio entero.|Le versant glisse dans la nuit et emporte toute une entreprise.|夜のうちに斜面が崩れ、事業ごと押し流していった。"),
  run:(p,k)=>doomLoseProps(p,k?2:1)},
 {id:"tranca",n:_t("Toll at the tranca|Peaje en la tranca|Péage à la tranca|検問所の通行料"),
  t:_t("A roadside checkpoint appears out of nowhere, and everyone else is holding the receipts.|Aparece un control de carretera de la nada, y los demás son quienes tienen los recibos.|Un contrôle routier surgit de nulle part, et ce sont les autres qui tiennent les reçus.|どこからともなく検問所が現れる。領収書を握っているのは他の旅人たちだ。"),
  run:(p,k)=>doomPayOthers(p,k?260:100)},
 {id:"soroche",n:_t("Soroche — altitude sickness|Soroche — mal de altura|Soroche — le mal des montagnes|ソローチェ(高山病)"),
  t:_t("The air thins to nothing. Head splitting, the whole party is bundled onto the wrong train.|El aire se acaba. Con la cabeza estallando, suben al tren equivocado.|L'air se raréfie. La tête en feu, toute la troupe est poussée dans le mauvais train.|空気が薄い。割れるような頭痛のまま、一行は間違った列車に押し込まれた。"),
  run:(p,k)=>doomTeleport(p,k?4:18)},
 {id:"theft",n:_t("El Tío picks a pocket|El Tío mete la mano|El Tío fait les poches|エル・ティーオの盗み"),
  t:_t("Something reaches into the ch'uspa bag while nobody is looking.|Algo hurga en la ch'uspa mientras nadie mira.|Quelque chose fouille la ch'uspa pendant que personne ne regarde.|誰も見ていない隙に、何かがチュスパ袋に手を伸ばした。"),
  run:(p,k)=>doomSteal(p,k?380:170)},
];
BOLIVIA.seasons=[
 {e:"🌾",n:_t("End of the rains|Fin de las lluvias|Fin des pluies|雨季の終わり"),
  t:_t("April dries the roads at last. Maize and potatoes come in across the valleys, and buses run on time for once.|Abril seca por fin los caminos. Llegan el maíz y la papa de los valles y, por una vez, los buses son puntuales.|Avril sèche enfin les routes. Maïs et pommes de terre arrivent des vallées, et pour une fois les bus sont à l'heure.|4月、ようやく道が乾く。渓谷ではトウモロコシとジャガイモの収穫。バスも珍しく時間通りに走る。"),
  f:_t("Bolivia's seasons are reversed from the northern hemisphere: the rains fall from November to March.|Las estaciones de Bolivia son inversas al hemisferio norte: llueve de noviembre a marzo.|Les saisons boliviennes sont inversées : il pleut de novembre à mars.|ボリビアの季節は北半球と逆。雨季は11月から3月です。"),
  run:()=>{mod.val=1.25;return _t("Valley harvests: valley income +25% this month.|Cosecha en los valles: renta de valles +25% este mes.|Récoltes des vallées : revenu des vallées +25% ce mois-ci.|渓谷の収穫期:渓谷地方の収入が今月 +25%。");}},
 {e:"❄",n:_t("Dry season begins|Empieza la época seca|Début de la saison sèche|乾季のはじまり"),
  t:_t("May opens the clearest skies of the year. Trucks reach places that were islands a month ago, and the mines run at full speed.|Mayo abre los cielos más limpios del año. Los camiones llegan a lugares que hace un mes eran islas y las minas trabajan a pleno.|Mai ouvre les ciels les plus clairs de l'année. Les camions atteignent des lieux qui étaient des îles un mois plus tôt, et les mines tournent à plein.|5月は一年で最も澄んだ空。1ヶ月前は孤島だった土地にもトラックが届き、鉱山はフル稼働する。"),
  f:_t("The dry winter, May to September, is when most travel and mining happens in the highlands.|El invierno seco, de mayo a septiembre, es la temporada de viajes y minería en las tierras altas.|L'hiver sec, de mai à septembre, est la saison des voyages et de l'extraction dans les hautes terres.|5〜9月の乾いた冬は、高地で旅と採掘が最も盛んな季節です。"),
  run:()=>{mod.alt=1.2;return _t("Mines at full speed: altiplano income +20%.|Minas a pleno: renta del altiplano +20%.|Mines à plein régime : revenu de l'altiplano +20%.|鉱山フル稼働:アルティプラーノの収入 +20%。");}},
 {e:"🌞",n:_t("Aymara New Year at Tiwanaku|Año Nuevo Aymara en Tiwanaku|Nouvel an aymara à Tiwanaku|ティワナクのアイマラ新年"),
  t:_t("On 21 June thousands wait through the freezing night at Tiwanaku to raise their palms to the first sunrise of the year 5,533.|El 21 de junio miles esperan la noche helada en Tiwanaku para alzar las palmas al primer sol del año 5.533.|Le 21 juin, des milliers de gens attendent la nuit glaciale à Tiwanaku pour lever les paumes vers le premier soleil de l'an 5 533.|6月21日、凍える夜を越え、数千人がティワナクで新年5533年の最初の日の出に掌をかざす。"),
  f:_t("Willkakuti, the Aymara new year, falls on the southern winter solstice and is a public holiday in Bolivia.|El Willkakuti, año nuevo aymara, cae en el solsticio de invierno austral y es feriado nacional.|Le Willkakuti, nouvel an aymara, tombe au solstice d'hiver austral et est férié en Bolivie.|アイマラの新年ウィルカクティは南半球の冬至にあたり、ボリビアの祝日です。"),
  run:()=>{const g=260;players.forEach(p=>p.cash+=g);
    return _t(`Pilgrims fill the altiplano — every traveler earns ${fmt(g)}.|Los peregrinos llenan el altiplano: cada viajero gana ${fmt(g)}.|Les pèlerins emplissent l'altiplano — chaque voyageur gagne ${fmt(g)}.|巡礼者で賑わい、全員が ${fmt(g)} を獲得。`);}},
 {e:"🥶",n:_t("Surazo — the cold wind|Surazo — el viento frío|Surazo — le vent froid|スラソ(南風の寒波)"),
  t:_t("A wind born in Patagonia races up the continent and drops the lowlands twenty degrees overnight. Cattle huddle; fuel bills bite.|Un viento nacido en la Patagonia sube el continente y baja veinte grados las tierras bajas en una noche. El ganado se apiña y el combustible cuesta.|Un vent né en Patagonie remonte le continent et fait chuter les basses terres de vingt degrés en une nuit. Le bétail se serre ; le carburant coûte cher.|パタゴニア生まれの風が大陸を駆け上がり、低地の気温を一晩で20度下げる。家畜は身を寄せ、燃料費がかさむ。"),
  f:_t("A surazo can push freezing air all the way into the Amazon, killing fish in the rivers.|Un surazo puede llevar aire helado hasta la Amazonía y matar peces en los ríos.|Un surazo peut pousser l'air glacé jusqu'en Amazonie et tuer les poissons des rivières.|スラソはアマゾンまで冷気を運び、川の魚を大量死させることもあります。"),
  run:()=>{const c=180;players.forEach(p=>p.cash=Math.max(0,p.cash-c));
    return _t(`Fuel and fodder: every traveler pays ${fmt(c)}.|Combustible y forraje: cada viajero paga ${fmt(c)}.|Carburant et fourrage : chaque voyageur paie ${fmt(c)}.|燃料と飼料で全員が ${fmt(c)} を支払う。`);}},
 {e:"🌎",n:_t("Month of the Pachamama|Mes de la Pachamama|Mois de la Pachamama|パチャママの月"),
  t:_t("All August belongs to Mother Earth. Families burn offerings and pour the first drop of every drink onto the ground before touching it themselves.|Todo agosto es de la Madre Tierra. Las familias queman ofrendas y derraman el primer trago en el suelo antes de beber.|Tout le mois d'août appartient à la Terre-Mère. Les familles brûlent des offrandes et versent la première gorgée au sol avant d'y toucher.|8月は丸ごと大地の母のもの。家々は供物を焚き、どんな飲み物も最初のひと注ぎを地面に捧げてから口にする。"),
  f:_t("The mesa offering — sweets, wool and llama fat burned for Pachamama — is prepared by a yatiri, an Aymara ritual specialist.|La mesa de ofrenda, con dulces, lana y sebo de llama, la prepara un yatiri, especialista ritual aymara.|La mesa d'offrande — sucreries, laine et graisse de lama brûlées pour la Pachamama — est préparée par un yatiri, spécialiste rituel aymara.|供物「メサ」は菓子・羊毛・リャマの脂を焚くもので、アイマラの祭祀者ヤティリが用意します。"),
  run:()=>{spiritRest=true;const c=120;players.forEach(p=>p.cash=Math.max(0,p.cash-c));
    return _t(`Everyone pays ${fmt(c)} for offerings — and El Tío, well fed, rests for one turn.|Todos pagan ${fmt(c)} en ofrendas y El Tío, satisfecho, descansa un turno.|Chacun paie ${fmt(c)} d'offrandes — et El Tío, repu, se repose un tour.|全員が供物代 ${fmt(c)} を支払う。満足したエル・ティーオは1ターン休む。`);}},
 {e:"🌱",n:_t("Quinoa sowing|Siembra de la quinua|Semis du quinoa|キヌアの種まき"),
  t:_t("September turns the southern altiplano. Families sow royal quinoa in the thin soil beside the salt flats, gambling on rain that may not come.|Septiembre voltea el altiplano sur. Se siembra quinua real en el suelo delgado junto a los salares, apostando a una lluvia incierta.|Septembre retourne l'altiplano sud. On sème le quinoa royal dans le sol maigre près des salars, en pariant sur une pluie incertaine.|9月、南部アルティプラーノの土が返される。塩原のそばの痩せた土にロイヤルキヌアを蒔き、来るかわからぬ雨に賭ける。"),
  f:_t("Quinoa survives frost, salt and drought that would kill wheat — which is why it fed the Andes for 5,000 years.|La quinua resiste heladas, sal y sequía que matarían al trigo; por eso alimentó a los Andes 5.000 años.|Le quinoa survit au gel, au sel et à la sécheresse qui tueraient le blé — d'où 5 000 ans de nourriture andine.|キヌアは小麦なら枯れる霜・塩・乾燥に耐えます。だからこそ5,000年間アンデスを養えました。"),
  run:()=>{mod.alt=1.15;return _t("Sowing season: altiplano income +15%.|Siembra: renta del altiplano +15%.|Semailles : revenu de l'altiplano +15%.|種まきの季節:アルティプラーノの収入 +15%。");}},
 {e:"🔥",n:_t("Fire season in the Chiquitanía|Temporada de fuegos en la Chiquitanía|Saison des feux en Chiquitanía|チキタニアの火入れ期"),
  t:_t("Smoke hazes the eastern sky as land is cleared before the rains. In bad years the fires escape into the dry forest and burn for weeks.|El humo enturbia el cielo oriental mientras se desmonta antes de las lluvias. En años malos el fuego escapa al bosque seco y arde semanas.|La fumée voile le ciel oriental tandis qu'on défriche avant les pluies. Les mauvaises années, le feu gagne la forêt sèche et brûle des semaines.|雨季前の焼畑で東の空が煙る。悪い年には火が乾燥林に逃げ、何週間も燃え続ける。"),
  f:_t("The 2019 Chiquitanía fires burned millions of hectares of unique dry forest — a habitat found almost nowhere else.|Los incendios de 2019 quemaron millones de hectáreas de bosque seco chiquitano, un hábitat casi único.|Les incendies de 2019 ont brûlé des millions d'hectares de forêt sèche chiquitano, un habitat presque unique au monde.|2019年のチキタニア大火では、他にほとんど例のない乾燥林が数百万ヘクタール焼失しました。"),
  run:()=>{mod.cha=0.7;return _t("Smoke and closed roads: Chaco & Chiquitanía income −30%.|Humo y caminos cerrados: renta del Chaco y la Chiquitanía −30%.|Fumée et routes fermées : revenu du Chaco et de la Chiquitanía −30%.|煙と通行止め:チャコ・チキタニア地方の収入 −30%。");}},
 {e:"🌧",n:_t("The rains return|Vuelven las lluvias|Le retour des pluies|雨季の再来"),
  t:_t("November clouds pile against the cordillera and burst. Within days the Beni turns from grassland into a shallow inland sea.|Las nubes de noviembre chocan con la cordillera y revientan. En días el Beni pasa de pastizal a un mar interior poco profundo.|Les nuages de novembre s'écrasent sur la cordillère et crèvent. En quelques jours, le Beni passe de la prairie à une mer intérieure peu profonde.|11月、雲が山脈にぶつかって裂ける。数日でベニは草原から浅い内海へと姿を変える。"),
  f:_t("Beni cattle are driven onto the ancient raised earthworks built a thousand years ago — the only dry ground for miles.|El ganado del Beni sube a los antiguos camellones de tierra, la única tierra seca en kilómetros.|Le bétail du Beni grimpe sur les anciens tertres bâtis il y a mille ans — la seule terre sèche à des kilomètres.|ベニの牛は千年前に築かれた盛土の上へ追われます。何キロ四方でそこだけが乾いた土地だからです。"),
  run:()=>{mod.ama=0.75;return _t("Floods across the Beni: Amazon income −25%.|Inundaciones en el Beni: renta amazónica −25%.|Inondations dans le Beni : revenu amazonien −25%.|ベニ大洪水:アマゾン地方の収入 −25%。");}},
 {e:"🎪",n:_t("Year-end trade fair|Feria de fin de año|Foire de fin d'année|年末の見本市"),
  t:_t("Santa Cruz fills with buyers. Soy, cattle and gas contracts are signed under canvas while the rest of the country shops for Christmas.|Santa Cruz se llena de compradores. Se firman contratos de soya, ganado y gas bajo la lona mientras el país hace compras navideñas.|Santa Cruz s'emplit d'acheteurs. Contrats de soja, de bétail et de gaz se signent sous la toile pendant que le pays fait ses achats de Noël.|サンタクルスに買い手が集まる。テントの下で大豆・牛・ガスの契約が結ばれ、国中はクリスマス商戦に沸く。"),
  f:_t("Santa Cruz department produces most of Bolivia's food exports, and its Expocruz fair is the country's biggest.|El departamento de Santa Cruz produce la mayoría de los alimentos de exportación y su Expocruz es la feria mayor del país.|Le département de Santa Cruz produit l'essentiel des exportations alimentaires, et son Expocruz est la plus grande foire du pays.|サンタクルス県はボリビアの食料輸出の大半を担い、エキスポクルスは国内最大の見本市です。"),
  run:()=>{mod.cha=1.3;return _t("Contracts everywhere: Chaco & Chiquitanía income +30%.|Contratos por doquier: renta del Chaco y la Chiquitanía +30%.|Des contrats partout : revenu du Chaco et de la Chiquitanía +30%.|契約ラッシュ:チャコ・チキタニア地方の収入 +30%。");}},
 {e:"🧿",n:_t("Alasitas — the fair of miniatures|Alasitas — la feria de las miniaturas|Alasitas — la foire des miniatures|アラシータ(ミニチュアの市)"),
  t:_t("On 24 January La Paz fills with tiny houses, tiny lorries, tiny diplomas and tiny bundles of banknotes, all blessed at noon.|El 24 de enero La Paz se llena de casitas, camioncitos, diplomas y fajos de billetes en miniatura, bendecidos al mediodía.|Le 24 janvier, La Paz déborde de maisonnettes, de camionnettes, de diplômes et de liasses miniatures, bénis à midi.|1月24日、ラパスは小さな家・小さなトラック・小さな卒業証書・小さな札束で埋まり、正午に祝福される。"),
  f:_t("Ekeko, the little moustachioed god loaded with goods, must be given a lit cigarette to keep granting wishes.|Al Ekeko, dios bigotudo cargado de mercancías, hay que darle un cigarrillo encendido para que siga concediendo deseos.|Il faut donner une cigarette allumée à Ekeko, petit dieu moustachu chargé de marchandises, pour qu'il continue d'exaucer les vœux.|荷物を背負った口ひげの神エケコには、火をつけたタバコを供えないと願いを叶えてくれません。"),
  run:()=>{let got=0;players.forEach(p=>{if(giveItem(p))got++;});
    return got?_t("Every traveler takes home an item from the fair.|Cada viajero se lleva un objeto de la feria.|Chaque voyageur rapporte un objet de la foire.|全員が市でアイテムをひとつ手に入れる。")
      :_t("Bags are full — nobody can carry another miniature.|Las bolsas están llenas: nadie puede llevar otra miniatura.|Les sacs sont pleins — plus personne ne peut porter de miniature.|荷物がいっぱいで、誰もミニチュアを持ち帰れない。");}},
 {e:"😈",n:_t("Carnaval de Oruro|Carnaval de Oruro|Carnaval d'Oruro|オルロのカーニバル"),
  t:_t("Forty thousand dancers and ten thousand musicians pour down four kilometres of street for twenty hours without stopping. The devils lead.|Cuarenta mil bailarines y diez mil músicos recorren cuatro kilómetros durante veinte horas sin parar. Los diablos van al frente.|Quarante mille danseurs et dix mille musiciens dévalent quatre kilomètres de rue pendant vingt heures sans arrêt. Les diables ouvrent la marche.|4万人の踊り手と1万人の楽士が4kmの道を20時間ノンストップで練り歩く。先頭は悪魔たちだ。"),
  f:_t("The Diablada ends with the devils kneeling before the Virgin of the Mineshaft — an Andean deity and a Catholic saint in one procession.|La Diablada termina con los diablos de rodillas ante la Virgen del Socavón: una deidad andina y una santa católica en la misma procesión.|La Diablada s'achève avec les diables agenouillés devant la Vierge du Puits de mine — une divinité andine et une sainte catholique dans la même procession.|ディアブラーダは悪魔たちが坑道の聖母の前にひざまずいて終わります。アンデスの神とカトリックの聖女が同じ行列に並ぶのです。"),
  run:()=>{const g=380;players.forEach(p=>p.cash+=g);mod.alt=1.3;
    return _t(`Carnival takings: everyone earns ${fmt(g)}, altiplano income +30%.|Ganancias del carnaval: cada uno gana ${fmt(g)}, renta del altiplano +30%.|Recettes du carnaval : chacun gagne ${fmt(g)}, revenu de l'altiplano +30%.|カーニバル特需:全員 ${fmt(g)} 獲得、アルティプラーノの収入 +30%。`);}},
 {e:"🌊",n:_t("Día del Mar|Día del Mar|Día del Mar|海の日"),
  t:_t("On 23 March the landlocked country turns to face a sea it has not touched since 1879. Cadets of the Bolivian navy parade in every city.|El 23 de marzo el país sin costa mira hacia un mar que no toca desde 1879. Los cadetes de la armada desfilan en cada ciudad.|Le 23 mars, le pays sans littoral se tourne vers une mer qu'il ne touche plus depuis 1879. Les cadets de la marine bolivienne défilent dans chaque ville.|3月23日、海のない国が1879年以来触れていない海の方角を向く。ボリビア海軍の候補生が各都市を行進する。"),
  f:_t("Bolivia's navy patrols Lake Titicaca and the Amazon rivers, and the country still formally claims a corridor to the Pacific.|La armada boliviana patrulla el Titicaca y los ríos amazónicos, y el país aún reclama formalmente una salida al Pacífico.|La marine bolivienne patrouille le Titicaca et les fleuves amazoniens, et le pays revendique toujours officiellement un couloir vers le Pacifique.|ボリビア海軍はチチカカ湖とアマゾンの河川を警備し、国は今も太平洋への回廊を公式に求めています。"),
  run:()=>{const g=200;players.forEach(p=>p.cash+=g);
    return _t(`Civic parades and trade fairs: everyone earns ${fmt(g)}.|Desfiles cívicos y ferias: cada uno gana ${fmt(g)}.|Défilés civiques et foires : chacun gagne ${fmt(g)}.|記念行事と物産市で全員が ${fmt(g)} を獲得。`);}},
];

 arrive:_t("<b>👺 Binbōgami climbs aboard!</b> In Japanese folklore the god of poverty is a thin, grubby old man with a paper fan who settles into the house of whoever is doing worst and quietly makes everything cost more. He now travels with <b>{0}</b>, the traveler farthest from the destination, and brings a misfortune every turn.|<b>👺 ¡Binbōgami sube al tren!</b> En el folclore japonés, el dios de la pobreza es un viejo flaco y desaliñado con un abanico de papel que se instala en la casa del que peor va y encarece todo. Ahora viaja con <b>{0}</b>, el más lejano del destino, y trae una desgracia cada turno.|<b>👺 Binbōgami monte à bord !</b> Dans le folklore japonais, le dieu de la pauvreté est un vieillard maigre et crasseux muni d'un éventail de papier ; il s'installe chez celui qui va le plus mal et renchérit tout, discrètement. Il voyage désormais avec <b>{0}</b>, le plus éloigné de la destination, et apporte un malheur à chaque tour.|<b>👺 貧乏神が乗り込んできた!</b> 日本の民間伝承では、貧乏神は痩せて薄汚れた老人の姿で、破れ団扇を手に、いちばん困っている家に住みつき、何もかもを高くつかせるという。目的地から最も遠い <b>{0}</b> に取り憑き、毎ターン災難をもたらします。"),
 moves:_t("👺 <b>Binbōgami</b> changes trains — he now clings to <b>{0}</b>, farthest from {1}.|👺 <b>Binbōgami</b> cambia de tren — ahora se agarra a <b>{0}</b>, el más lejos de {1}.|👺 <b>Binbōgami</b> change de train — il s'accroche maintenant à <b>{0}</b>, le plus loin de {1}.|👺 <b>貧乏神</b> が乗り換えた — {1} から最も遠い <b>{0}</b> に憑いた。"),
 wake:_t("<b>{0}</b> has carried Binbōgami for four turns without shaking him off. He sheds his rags, and the far grimmer Yakubyōgami — the god of plague and calamity — takes his place. Every misfortune now strikes twice as hard.|<b>{0}</b> lleva cuatro turnos con Binbōgami encima. Se despoja de sus harapos y el mucho más siniestro Yakubyōgami, dios de la plaga, ocupa su lugar. Cada desgracia golpea el doble.|<b>{0}</b> porte Binbōgami depuis quatre tours sans s'en défaire. Il quitte ses haillons et le bien plus sinistre Yakubyōgami, dieu des fléaux, prend sa place. Chaque malheur frappe deux fois plus fort.|<b>{0}</b> は4ターン連続で貧乏神を振り払えなかった。ぼろをかなぐり捨て、さらに恐ろしい疫病神が姿を現す。これ以降の災難は2倍の威力に。"),
 wakeFact:_t("<b>Behind the story:</b> Folk tales say Binbōgami can be driven out with noise, warmth and a well-fed household — which is why some families still cook a feast on the night they wish to send him away.|<b>Detrás del relato:</b> Los cuentos dicen que a Binbōgami se le echa con ruido, calor y una casa bien alimentada; por eso algunas familias cocinan un festín la noche en que quieren despedirlo.|<b>Derrière le récit :</b> Les contes disent qu'on chasse Binbōgami par le bruit, la chaleur et une maisonnée bien nourrie — d'où le festin que certaines familles préparent le soir où elles veulent le congédier.|<b>背景:</b> 昔話では、貧乏神は賑やかさ・暖かさ・満ち足りた食卓に弱いとされ、追い出したい晩にはあえてごちそうを作る家もありました。"),

  f:_t("The name means 'plum rain' because the season coincides with the ripening of ume plums. Hokkaidō is the one region that escapes it.|Se llama 'lluvia de ciruela' porque coincide con la maduración del ume. Hokkaidō es la única región que se libra.|On l'appelle « pluie des prunes » car la saison coïncide avec la maturité des ume. Hokkaidō est la seule région épargnée.|梅の実が熟す頃に降るので「梅雨」。北海道だけがこの季節を免れます。"),
  run:()=>{mod.kan=0.8;mod.kin=0.8;mod.kyu=0.8;
    return _t("Rain keeps everyone indoors: income −20% everywhere except the north.|La lluvia encierra a todos: renta −20% salvo en el norte.|La pluie garde tout le monde à l'abri : revenu −20% sauf au nord.|雨で客足が遠のく:北海道・東北を除き収入 −20%。");}},
 {e:"🏮",n:_t("Summer festival season|Temporada de fiestas de verano|Saison des fêtes d'été|夏祭り"),
  t:_t("July belongs to the matsuri. Portable shrines are shouldered through packed streets, drums carry for a mile, and everyone wears a cotton yukata.|Julio es de los matsuri. Se cargan santuarios portátiles por calles atestadas, los tambores se oyen a un kilómetro y todos visten yukata.|Juillet appartient aux matsuri. On porte les sanctuaires portatifs dans des rues bondées, les tambours s'entendent à un kilomètre, et chacun revêt un yukata.|7月は祭りの月。担がれた神輿が人波を進み、太鼓は一里先まで響き、誰もが浴衣を着る。"),
  f:_t("Kyoto's Gion Matsuri has been held for over 1,100 years; its floats are so tall they must be dismantled to pass under wires.|El Gion Matsuri de Kioto lleva más de 1.100 años; sus carrozas son tan altas que hay que desmontarlas para pasar bajo los cables.|Le Gion Matsuri de Kyoto se tient depuis plus de 1 100 ans ; ses chars sont si hauts qu'il faut les démonter pour passer sous les câbles.|京都の祇園祭は1,100年以上続きます。山鉾は高すぎて、電線をくぐるために解体することもあります。"),
  run:()=>{const g=260;players.forEach(p=>p.cash+=g);mod.kin=1.25;
    return _t(`Festival takings: everyone earns ${fmt(g)}, Kansai income +25%.|Ganancias de las fiestas: cada uno gana ${fmt(g)}, renta de Kansai +25%.|Recettes des fêtes : chacun gagne ${fmt(g)}, revenu du Kansai +25%.|祭りの売上で全員 ${fmt(g)} 獲得、関西の収入 +25%。`);}},
 {e:"🌀",n:_t("Typhoon season and Obon|Temporada de tifones y Obon|Saison des typhons et Obon|台風とお盆"),
  t:_t("The storms come up from the south while the whole country travels home to greet the returning dead. Lanterns are floated downriver to send them back.|Las tormentas suben desde el sur mientras el país viaja a casa para recibir a los muertos que vuelven. Se sueltan farolillos río abajo para despedirlos.|Les tempêtes remontent du sud tandis que le pays entier rentre accueillir ses morts. On lâche des lanternes au fil de l'eau pour les raccompagner.|南から嵐が上がってくる頃、人々は帰省し、戻ってくる先祖を迎える。送り火や灯籠流しでふたたび送り出す。"),
  f:_t("Around 25 typhoons form in the western Pacific each year, and roughly three make landfall on Japan.|Cada año se forman unos 25 tifones en el Pacífico occidental y unos tres tocan tierra en Japón.|Environ 25 typhons se forment chaque année dans le Pacifique occidental, et près de trois touchent le Japon.|年に約25個の台風が西太平洋で発生し、うち3個ほどが日本に上陸します。"),
  run:()=>{mod.kyu=0.7;spiritRest=true;
    return _t("Storms batter the south: Kyūshū & Okinawa income −30%. The Obon offerings keep the spirit quiet for one turn.|Las tormentas azotan el sur: renta de Kyūshū y Okinawa −30%. Las ofrendas de Obon calman al espíritu un turno.|Les tempêtes frappent le sud : revenu de Kyūshū et Okinawa −30%. Les offrandes d'Obon apaisent l'esprit pour un tour.|南は暴風雨:九州・沖縄の収入 −30%。お盆の供養で厄災の神は1ターン休む。");}},
 {e:"🌕",n:_t("Harvest moon and the rice cut|Luna de la cosecha y la siega|Lune des moissons et la coupe du riz|十五夜と稲刈り"),
  t:_t("The paddies turn gold and are cut in a week. Families set out pampas grass and round white dumplings to watch the September moon.|Los arrozales se vuelven dorados y se siegan en una semana. Las familias ponen hierba de la pampa y bolitas blancas para mirar la luna de septiembre.|Les rizières virent à l'or et sont fauchées en une semaine. Les familles disposent des herbes de la pampa et des boulettes blanches pour contempler la lune de septembre.|田は黄金色に変わり、一週間で刈り取られる。家々はすすきと白い団子を供え、九月の月を眺める。"),
  f:_t("Rice is so central that the same word, gohan, means both 'cooked rice' and 'a meal'.|El arroz es tan central que la misma palabra, gohan, significa 'arroz cocido' y 'comida'.|Le riz est si central que le même mot, gohan, désigne à la fois « riz cuit » et « repas ».|米は生活の中心で、「ごはん」は炊いた米と食事そのものの両方を指します。"),
  run:()=>{mod.nor=1.3;
    return _t("Harvest across the north: Hokkaidō & Tōhoku income +30%.|Cosecha en el norte: renta de Hokkaidō y Tōhoku +30%.|Moisson dans le nord : revenu de Hokkaidō et Tōhoku +30%.|北の収穫期:北海道・東北の収入 +30%。");}},
 {e:"🍁",n:_t("Kōyō — the autumn leaves|Kōyō — las hojas de otoño|Kōyō — les feuilles d'automne|紅葉"),
  t:_t("The maples turn from the mountains downwards and the whole country goes looking. Temple gardens in Kyoto open at night to light the red canopy from below.|Los arces enrojecen desde las montañas y el país entero sale a mirarlos. Los jardines de Kioto abren de noche para iluminar la bóveda roja desde abajo.|Les érables rougissent depuis les montagnes et le pays entier part les regarder. Les jardins de Kyoto ouvrent la nuit pour éclairer la voûte rouge par en dessous.|山の上から楓が色づき、国じゅうが紅葉狩りに出かける。京都の庭は夜間拝観を開き、下から赤い天蓋を照らす。"),
  f:_t("Forecasters publish a kōyō front just like the cherry-blossom one, but it travels the other way — from north to south.|Los meteorólogos publican un frente de kōyō como el de los cerezos, pero viaja al revés: de norte a sur.|Les météorologues publient un front du kōyō comme celui des cerisiers, mais il voyage en sens inverse : du nord au sud.|気象各社は桜前線と同じく紅葉前線を発表します。ただし進む向きは逆で、北から南へ下ります。"),
  run:()=>{mod.kin=1.3;mod.nor=1.15;
    return _t("Leaf-viewing crowds: Kansai income +30%, north +15%.|Multitudes por las hojas: renta de Kansai +30%, norte +15%.|Foules venues voir les feuilles : revenu du Kansai +30%, nord +15%.|紅葉狩りの客で賑わう:関西の収入 +30%、北 +15%。");}},
 {e:"🍶",n:_t("New sake and Shichi-Go-San|Sake nuevo y Shichi-Go-San|Saké nouveau et Shichi-Go-San|新酒と七五三"),
  t:_t("Cedar balls are hung outside the breweries to announce the year's first pressing. Children of three, five and seven are dressed up and taken to the shrine.|Se cuelgan bolas de cedro en las bodegas para anunciar el primer prensado del año. Los niños de tres, cinco y siete años van al santuario vestidos de gala.|Des boules de cèdre sont suspendues aux brasseries pour annoncer le premier pressage de l'année. Les enfants de trois, cinq et sept ans sont endimanchés et menés au sanctuaire.|酒蔵の軒に杉玉が吊るされ、その年の新酒を告げる。三歳・五歳・七歳の子は晴れ着で神社へ詣でる。"),
  f:_t("The cedar ball, a sugidama, is hung green and turns brown as the sake matures — a calendar anyone can read.|La bola de cedro, sugidama, se cuelga verde y se vuelve marrón mientras madura el sake: un calendario legible por todos.|La boule de cèdre, sugidama, est verte à l'accrochage et brunit à mesure que le saké mûrit — un calendrier lisible par tous.|杉玉は青いまま吊るされ、酒の熟成とともに茶色く枯れていきます。誰にでも読める暦です。"),
  run:()=>{mod.nor=1.25;mod.kan=1.1;
    return _t("Brewing season: north income +25%, Kantō & Chūbu +10%.|Temporada de elaboración: renta del norte +25%, Kantō y Chūbu +10%.|Saison de brassage : revenu du nord +25%, Kantō et Chūbu +10%.|仕込みの季節:北の収入 +25%、関東・中部 +10%。");}},
 {e:"🎍",n:_t("Shiwasu — the year-end rush|Shiwasu — las prisas de fin de año|Shiwasu — la course de fin d'année|師走"),
  t:_t("December's old name means 'even the priests run'. Year-end parties fill every restaurant, offices scrub their desks, and the shops never close.|El viejo nombre de diciembre significa 'hasta los sacerdotes corren'. Las fiestas de fin de año llenan los restaurantes y las tiendas no cierran.|L'ancien nom de décembre signifie « même les prêtres courent ». Les fêtes de fin d'année remplissent les restaurants, les bureaux font le grand ménage, et les boutiques ne ferment jamais.|師走の語源は「師(僧)さえ走り回る」。忘年会で店は満席、職場は大掃除、商店は休まない。"),
  f:_t("On 31 December temple bells are rung 108 times, once for each earthly desire in Buddhist teaching.|El 31 de diciembre las campanas se tocan 108 veces, una por cada deseo terrenal según el budismo.|Le 31 décembre, les cloches sonnent 108 fois, une pour chaque désir terrestre selon le bouddhisme.|大晦日には除夜の鐘が108回。仏教でいう百八の煩悩の数だけ撞かれます。"),
  run:()=>{mod.kan=1.3;
    return _t("Year-end spending: Kantō & Chūbu income +30%.|Gasto de fin de año: renta de Kantō y Chūbu +30%.|Dépenses de fin d'année : revenu du Kantō et du Chūbu +30%.|年末商戦:関東・中部の収入 +30%。");}},
 {e:"⛩",n:_t("Hatsumōde — the first shrine visit|Hatsumōde — la primera visita al santuario|Hatsumōde — la première visite au sanctuaire|初詣"),
  t:_t("In the first three days of January nearly a hundred million people queue at shrines to throw a coin, clap twice and ask for a decent year.|En los tres primeros días de enero casi cien millones de personas hacen cola para lanzar una moneda, dar dos palmadas y pedir un buen año.|Dans les trois premiers jours de janvier, près de cent millions de personnes font la queue pour jeter une pièce, taper deux fois dans les mains et demander une bonne année.|正月三が日で延べ一億人近くが列に並び、賽銭を投げ、二礼二拍手一礼して一年を願う。"),
  f:_t("Meiji Shrine in Tokyo alone receives over three million visitors in those three days.|Sólo el santuario Meiji de Tokio recibe más de tres millones de visitantes en esos tres días.|Le seul sanctuaire Meiji de Tokyo reçoit plus de trois millions de visiteurs en ces trois jours.|東京の明治神宮だけで、三が日に300万人以上が訪れます。"),
  run:()=>{let got=0;players.forEach(p=>{if(giveItem(p))got++;});
    return got?_t("Everyone draws a lucky charm at the shrine.|Cada uno saca un amuleto en el santuario.|Chacun tire une amulette au sanctuaire.|全員が社頭で縁起物をひとつ手に入れる。")
      :_t("Bags are full — nobody can carry another charm.|Las bolsas están llenas: nadie puede llevar otro amuleto.|Les sacs sont pleins — plus personne ne peut porter d'amulette.|荷物がいっぱいで、誰も縁起物を持ち帰れない。");}},
 {e:"⛄",n:_t("Deep snow in the north|Nieve profunda en el norte|Neige profonde au nord|豪雪と雪まつり"),
  t:_t("Snow banks rise above the ground floor along the Sea of Japan while Sapporo carves palaces out of it and lights them from within.|Los muros de nieve superan la planta baja junto al mar del Japón, mientras Sapporo esculpe palacios y los ilumina por dentro.|Les congères dépassent le rez-de-chaussée le long de la mer du Japon, tandis que Sapporo y sculpte des palais éclairés de l'intérieur.|日本海側では雪の壁が一階を越え、札幌ではその雪から宮殿が彫り出され、内側から灯される。"),
  f:_t("Some Hokuriku towns average over eight metres of snowfall a season — among the heaviest in any inhabited place on Earth.|Algunas ciudades de Hokuriku promedian más de ocho metros de nieve por temporada, de las mayores del mundo habitado.|Certaines villes du Hokuriku reçoivent en moyenne plus de huit mètres de neige par saison — parmi les plus fortes du monde habité.|北陸には年間降雪量が8mを超える町もあり、人が住む土地としては世界屈指の豪雪地帯です。"),
  run:()=>{const c=180;players.forEach(p=>p.cash=Math.max(0,p.cash-c));mod.nor=1.2;
    return _t(`Heating and snow clearing cost ${fmt(c)} each — but the snow festival lifts the north +20%.|Calefacción y quitanieves cuestan ${fmt(c)} a cada uno, pero el festival de nieve sube el norte +20%.|Chauffage et déneigement coûtent ${fmt(c)} à chacun — mais le festival de la neige fait grimper le nord de 20%.|暖房と除雪で全員 ${fmt(c)} を支払う。ただし雪まつりで北の収入は +20%。`);}},
 {e:"🎓",n:_t("End of the fiscal year|Fin del año fiscal|Fin de l'exercice|年度末"),
  t:_t("March closes the school and business year at once. Graduation ceremonies in the morning, transfer orders in the afternoon, and removal vans on every corner.|Marzo cierra a la vez el año escolar y el fiscal. Graduaciones por la mañana, traslados por la tarde y camiones de mudanza en cada esquina.|Mars clôt d'un coup l'année scolaire et l'exercice comptable. Remises de diplômes le matin, mutations l'après-midi, et camions de déménagement à tous les coins de rue.|3月は学年度と会計年度が同時に終わる。午前は卒業式、午後は辞令、街角には引っ越しトラックが並ぶ。"),
  f:_t("Japan's school and fiscal years both begin in April, which is why cherry blossom is the image of new beginnings.|Los años escolar y fiscal empiezan en abril, y por eso el cerezo simboliza los comienzos.|Les années scolaire et fiscale commencent en avril : d'où le cerisier comme image des commencements.|学年も会計年度も4月始まり。だから桜は「新しい始まり」の象徴なのです。"),
  run:()=>{const c=150;players.forEach(p=>p.cash=Math.max(0,p.cash-c));mod.kan=1.15;mod.kin=1.15;
    return _t(`Moving costs ${fmt(c)} each — but the rush lifts Kantō and Kansai +15%.|La mudanza cuesta ${fmt(c)} a cada uno, pero el ajetreo sube Kantō y Kansai +15%.|Le déménagement coûte ${fmt(c)} à chacun — mais la cohue fait grimper Kantō et Kansai de 15%.|引っ越し費用で全員 ${fmt(c)} を支払う。繁忙で関東・関西の収入は +15%。`);}},
];

const TIER={low:{win:100,lose:30,col:"#37b3a4",lbl:_t("Short question|Pregunta corta|Question courte|かんたんな問題")},
            mid:{win:190,lose:65,col:"#f5b31c",lbl:_t("Standard question|Pregunta normal|Question normale|ふつうの問題")},

const h32=x=>{x=(x^61)^(x>>>16);x=x+(x<<3);x=x^(x>>>4);x=Math.imul(x,0x27d4eb2d);x=x^(x>>>15);return x>>>0;};
const SQUARE={
 blue:{col:"#5b8fe8",glyph:"+",lbl:()=>T("blueSq")},
 red:{col:"#e05252",glyph:"−",lbl:()=>T("redSq")},
 card:{col:"#f5d31c",glyph:"★",lbl:()=>T("cardSq")},
};
let nodes={},adj={},EDGE_N=[];
function buildGraph(){
  const p=G.proj; BW=p.BW; BH=p.BH;
  PX=l=>((l-p.LON0)/(p.LON1-p.LON0))*BW;
  PY=l=>((l-p.LAT0)/(p.LAT1-p.LAT0))*BH;
  nodes={};adj={};EDGE_N=[];
  for(const id in G.cities){const c=G.cities[id];
    nodes[id]={id,type:"city",x:PX(c.lo),y:PY(c.la),reg:c.reg,mark:c.mark,lp:c.lp};adj[id]=[];}
  G.edges.forEach(([a,b],ei)=>{
    const A=nodes[a],B=nodes[b];
    const dist=Math.hypot(B.x-A.x,B.y-A.y);
    const n=Math.max(1,Math.min(5,Math.round(dist/(G.proj.seg||64))));
    EDGE_N[ei]=n;
    const chain=[a];
    for(let k=1;k<=n;k++){
      const t=k/(n+1),id=`e${ei}_${k}`;
      const dx=B.x-A.x,dy=B.y-A.y,len=dist||1;
      const j=((ei*7+k*13)%5-2)*5;
      const x=A.x+dx*t+(-dy/len)*j, y=A.y+dy*t+(dx/len)*j;
      const reg=G.cities[t<0.5?a:b].reg;
      const roll=h32(ei*97+k)%20;
      let nd;
      if(roll<10) nd={type:"quiz",tier:["low","mid","high"][h32(ei*211+k*7)%3]};
      else if(roll<14) nd={type:"blue"};
      else if(roll<17) nd={type:"red"};
      else nd={type:"card"};
      nodes[id]=Object.assign({id,x,y,between:[a,b],reg},nd);
      adj[id]=[];chain.push(id);
    }
    chain.push(b);
    for(let i=0;i<chain.length-1;i++){adj[chain[i]].push(chain[i+1]);adj[chain[i+1]].push(chain[i]);}
  });
}
function bfsDist(from,to){
  if(from===to) return 0;
  const seen={[from]:0},q=[from];
  while(q.length){const c=q.shift();
    for(const nb of adj[c]){if(seen[nb]===undefined){seen[nb]=seen[c]+1;if(nb===to)return seen[nb];q.push(nb);}}}
  return 999;
}

const clampCam=(x,y,w)=>[Math.max(-40,Math.min(BW-w+40,x)),Math.max(-40,Math.min(BH-w*BH/BW+40,y))];
function camTo(cx,cy,w,ms=560){
  w=Math.max(300,Math.min(BW+80,w));
  const [x,y]=clampCam(cx-w/2,cy-(w*BH/BW)/2,w);
  if(camAnim)cancelAnimationFrame(camAnim);
  const s={x:CAM.x,y:CAM.y,w:CAM.w},t0=performance.now();
  const step=now=>{
    const k=Math.min(1,(now-t0)/ms),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    CAM.x=s.x+(x-s.x)*e;CAM.y=s.y+(y-s.y)*e;CAM.w=s.w+(w-s.w)*e;
    applyCam();
    camAnim=k<1?requestAnimationFrame(step):null;
  };
  camAnim=requestAnimationFrame(step);
}

/* ═══════════ DICE ═══════════ */
const PIP_POS={1:[[2,2]],2:[[1,1],[3,3]],3:[[1,1],[2,2],[3,3]],4:[[1,1],[1,3],[3,1],[3,3]],
               5:[[1,1],[1,3],[2,2],[3,1],[3,3]],6:[[1,1],[1,3],[2,1],[2,3],[3,1],[3,3]]};
const FACE_ROT={1:[0,0],2:[90,0],3:[0,-90],4:[0,90],5:[-90,0],6:[0,180]};
(function(){
  const F=[["translateZ(48px)",1],["rotateY(180deg) translateZ(48px)",6],["rotateY(90deg) translateZ(48px)",3],
           ["rotateY(-90deg) translateZ(48px)",4],["rotateX(90deg) translateZ(48px)",5],["rotateX(-90deg) translateZ(48px)",2]];
  const pips=v=>PIP_POS[v].map(([r,c])=>`<i style="grid-row:${r};grid-column:${c}"></i>`).join("");
  document.getElementById("die3d").innerHTML=F.map(([t,v])=>`<div class="f" style="transform:${t}">${pips(v)}</div>`).join("");
})();
function rollDice(forced,quick){
  return new Promise(resolve=>{
    const v=forced||(1+rnd(6));
    const stage=document.getElementById("diceStage");
    const die=document.getElementById("die3d"),sh=document.getElementById("dieShadow");
    const rEl=document.getElementById("dieResult"),hint=document.getElementById("dieHint");
    rEl.className="die-result";rEl.textContent="";hint.textContent=T("tapStop");
    stage.classList.add("on");
    const W=stage.clientWidth||620,H=stage.clientHeight||620;
    const s=Math.max(.6,Math.min(1.15,W/640));
    const startX=W*.16,endX=W*.45+(Math.random()*.2-.1)*W,ground=H*.58;
    let dur=forced?720:(quick?1150:1750);
    const [tx0,ty0]=FACE_ROT[v];
    const rx0=forced?0:rnd(360),ry0=forced?0:rnd(360),spin=forced?1:3;
    const rx1=tx0+360*(spin+rnd(3))+360*Math.ceil(rx0/360);
    const ry1=ty0+360*(spin+rnd(3))+360*Math.ceil(ry0/360);
    const bounces=3;let stopped=false,lastSeg=0;
    const t0=performance.now();
    if(!quick&&!forced){
      hint.style.display="block";stage.classList.add("tappable");
      stage.onclick=()=>{if(stopped)return;stopped=true;
        dur=Math.max(performance.now()-t0+420,760);hint.style.display="none";stage.classList.remove("tappable");};
    }else{hint.style.display="none";stage.classList.remove("tappable");stage.onclick=null;}
    Snd.rattle();
    const frame=now=>{
      const t=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-t,3);
      const x=startX+(endX-startX)*e,k=Math.min(1,t/.88);
      const phase=k*bounces,seg=Math.floor(phase),frac=phase-seg;
      const amp=H*.25*Math.pow(.45,seg)*(1-k*.15);
      const y=t>=1?ground:ground-Math.abs(Math.sin(Math.PI*frac))*amp;
      if(seg>lastSeg&&seg<=bounces){lastSeg=seg;Snd.thud();}
      die.style.transform=`translate3d(${x-48*s}px,${y-48*s}px,0) rotateX(${rx0+(rx1-rx0)*e}deg) rotateY(${ry0+(ry1-ry0)*e}deg) scale3d(${s},${s},${s})`;
      const air=Math.min(1,(ground-y)/(H*.26)),sc=(1-air*.45)*s;
      sh.style.width=(84*sc)+"px";sh.style.height=(19*sc)+"px";
      sh.style.left=(x-42*sc)+"px";sh.style.top=(ground+40*s)+"px";
      sh.style.opacity=(.12+.32*sc).toFixed(2);
      if(t<1)requestAnimationFrame(frame);
      else{
        hint.style.display="none";stage.classList.remove("tappable");stage.onclick=null;
        rEl.textContent=v;rEl.className="die-result show";Snd.coin();
        setTimeout(()=>{stage.classList.remove("on");resolve(v);},quick||forced?520:800);
      }
    };
    requestAnimationFrame(frame);
  });
}

}

async function playTurn(){
  const p=players[turnIdx];
  refreshPlayers();camWho(p.name);
  if(!overview)focusNode(p.node,FOLLOW_W);
  Snd.region(nodes[p.node].reg);
  document.getElementById("turnName").textContent=T("turnOf",p.name);
  document.getElementById("turnHint").textContent=p.cpu?T("thinking"):T("rollHint");
  await turnBanner(p,p.cpu);
  if(spiritLevel&&spiritHolder===turnIdx){await spiritStrike(p);if(over)return;}
  if(p.skip){p.skip=false;log(T("stuck",p.name),"bad");refreshPlayers();await sleep(500);return;}
  let steps=null,teleport=false;
  if(p.cpu){await cpuItems(p);dieBtn.disabled=true;await sleep(420);steps=await animateRoll(true);}
  else{const act=await humanAction(p);if(act.type==="teleport")teleport=true;else steps=act.steps;}
  if(teleport){
    p.node=dest;renderTokens();focusNode(p.node,FOLLOW_W,320);await sleep(360);
    refreshPlayers();await land(p);return;
  }
  log(T("rolls",p.name,steps));
  const reach=reachable(p.node,steps);
  const path=p.cpu?cpuPick(reach,p):await humanPick(reach,steps,p);
  document.getElementById("turnHint").textContent=T("riding");
  for(const s of path){
    p.node=s;renderTokens();Snd.step();
    if(!overview)focusNode(p.node,Math.min(CAM.w,FOLLOW_W),190);
    await sleep(195);
    if(await tryPassSpirit(p,s)) renderTokens();
  }
  Snd.region(nodes[p.node].reg);
  refreshPlayers();
  await land(p);
  if(!over) await settleSpirit(p);
}
/* passing over an occupied square hands the spirit across, momotetsu-style */
async function tryPassSpirit(mover,node){
  if(!spiritLevel||players[spiritHolder]!==mover)return false;
  const other=players.findIndex((o,i)=>o!==mover&&o.node===node);
  if(other<0)return false;
  spiritHolder=other;spiritTurns=0;spiritStuck=players.length;
  renderTokens();refreshPlayers();Snd.tio(false);
  const nm=G.spirit.e+" "+tx(G.spirit.n);
  log(T("passLog",G.spirit.e,mover.name,players[other].name),"tio");
  await modalOnce(`<div class="eyebrow">${T("passOn")}</div><h3>${G.spirit.e} ${T("passOn")}</h3>
    <p>${T("passBody",mover.name,players[other].name,nm)}</p>`,T("continue"),"doom");
  return true;
}
/* after every turn the spirit drifts to whoever is farthest from the destination,
   unless it was just deliberately passed on */
async function settleSpirit(mover){
  if(!spiritLevel)return;
  if(spiritStuck>0){spiritStuck--;return;}
  const f=farthestIdx();
  if(f<0||f===spiritHolder)return;
  const prev=spiritHolder;
  spiritHolder=f;spiritTurns=0;
  renderTokens();refreshPlayers();
  const nm=G.spirit.e+" "+tx(G.spirit.n);
  log(T("spiritFollows",nm,players[f].name),"tio");
  if(prev>=0) await modalOnce(`<div class="eyebrow">${T("spiritStrikes")}</div><h3>${G.spirit.e} ${tx(G.spirit.n)}</h3>
    <p>${T2(G.spirit.moves,players[f].name,cityName(dest))}</p>`,T("continue"),"doom");
}
function reachable(from,steps){
  let cur=[{node:from,prev:null,path:[]}];
  for(let s=0;s<steps;s++){
    const seen={},next=[];
    for(const st of cur){
      let opts=adj[st.node].filter(nb=>s===0||nb!==st.prev);
      if(!opts.length)opts=adj[st.node];
      for(const nb of opts){
        const key=nb+"|"+st.node;
        if(seen[key])continue;
        seen[key]=1;next.push({node:nb,prev:st.node,path:st.path.concat(nb)});
      }
    }
    cur=next;if(!cur.length)break;
  }
  const out=new Map();
  cur.forEach(st=>{if(!out.has(st.node))out.set(st.node,st.path);});
  return out;
}
function humanPick(reach,r,p){
  const ids=[...reach.keys()];
  document.getElementById("turnHint").textContent=T("tapSquare",r);
  if(!overview)fitNodes(ids.concat([p.node]),110,420);
  return new Promise(res=>{
    const gs=ids.map(id=>boardEl.querySelector(`[data-id="${id}"]`));
    gs.forEach(g=>{
      const id=g.dataset.id,halo=g.querySelector(".halo");
      halo.setAttribute("opacity",".75");
      halo.setAttribute("fill",id===dest?"#f5b31c":nodes[id].type==="city"?"#f6efe2":"#f5b31c");
      g.classList.add("choosable");g.setAttribute("tabindex","0");
      const pick=()=>{cleanup();res(reach.get(id));};
      g.onclick=pick;
      g.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick();}};
    });
    function cleanup(){gs.forEach(g=>{g.classList.remove("choosable");g.querySelector(".halo").setAttribute("opacity","0");
      g.onclick=null;g.onkeydown=null;g.setAttribute("tabindex","-1");});}
  });
}
function cpuPick(reach,p){
  const Cc=CPU[cpuLv];
  let best=null,bs=-1e9;
  for(const [id,path] of reach){
    let sc=-bfsDist(id,dest)*10;
    if(id===dest)sc+=280;
    const nd=nodes[id];
    if(nd.type==="city"){
      const free=G.cities[id].props.some((_,i)=>!ownerOf(propKey(id,i)));
      const mine=G.cities[id].props.filter((_,i)=>p.props[propKey(id,i)]).length;
      if(free&&p.cash>=G.cities[id].props[0].cost)sc+=14+mine*12;
    }else if(nd.tier==="high"&&p.cash>300)sc+=4;
    sc+=Math.random()*(4+Cc.noise);
    if(sc>bs){bs=sc;best=path;}
  }
  return best;
}

      if(it.d===G.items.taxi?.d||key==="pass"||key==="taxi"){
        const n=await new Promise(r2=>{

          document.querySelectorAll("#dp button").forEach(b=>b.onclick=()=>{hideModal();r2(+b.dataset.n);});

async function cpuItems(p){

  else if(pick.k==="zebra"||pick.k==="tasuki"){p.extra=true;log(T("extraTurn",p.name),"gold");}

function roulette(values,up){
  return new Promise(res=>{
    const pick=values[rnd(values.length)];
    const box=document.getElementById("roulBox");
    if(!box){res(pick);return;}
    const num=box.querySelector(".num");
    let t=0;
    const iv=setInterval(()=>{
      num.textContent=(up?"+":"−")+fmt(values[rnd(values.length)]);
      Snd.tick();
      if(++t>13){
        clearInterval(iv);
        num.textContent=(up?"+":"−")+fmt(pick);
        box.classList.add("settled");
        up?Snd.coin():Snd.wrong();
        setTimeout(()=>res(pick),620);
      }
    },95);
  });
}
const scaleAmt=v=>Math.round(v*(1+month*0.06)/10)*10;

async function quizStop(p,st){
  const q=drawQuiz();
  const opts=q.o.map((o,i)=>({t:tx(o),ok:i===q.a})).sort(()=>Math.random()-.5);
  const lbl=tx(st.lbl);
  const wardKey=Object.keys(G.items).find(k=>G.items[k].kind==="passive"&&k!==G.spirit.ward);
  if(p.cpu){
    const ok=Math.random()<CPU[cpuLv].acc;
    const pick=ok?opts.find(o=>o.ok):opts.find(o=>!o.ok);
    p.cash=Math.max(0,p.cash+(ok?st.win:-st.lose));
    ok?Snd.right():Snd.wrong();
    let bonus="";
    if(ok&&Math.random()<.3){const g=giveItem(p);if(g)bonus=`<p style="margin-top:8px;color:var(--gold);font-weight:800">${T("alsoWins",g.e,p.name,tx(g.n))}</p>`;}
    await autoModal(`<div class="eyebrow">${lbl} · ${p.name} (CPU)</div><h3>${tx(q.q)}</h3>
      <p>${T("cpuAnswers",p.name,pick.t)}${ok?`<span class="money">${T("correctPlus",fmt(st.win))}</span>`:`<span class="money neg">${T("wrongMinus",fmt(st.lose))}</span>`}</p>${bonus}
      <div class="fact"><b>${T("didYouKnow")}</b> ${tx(q.f)}</div>`,3000);
    log(ok?T("quizOkLog",p.name,fmt(st.win)):T("quizNoLog",p.name,fmt(st.lose)),ok?"good":"bad");
    return;
  }
  await new Promise(res=>{
    showModal(`<div class="eyebrow">${T("quizTier",lbl,fmt(st.win),fmt(st.lose))}</div><h3>${tx(q.q)}</h3>
      <div class="btnrow" style="flex-direction:column" id="qOpts">${opts.map(o=>`<button class="btn opt" data-ok="${o.ok}">${o.t}</button>`).join("")}</div>`);
    document.querySelectorAll("#qOpts .opt").forEach(b=>{
      b.onclick=()=>{
        let ok=b.dataset.ok==="true",saved=false;
        const pi=wardKey?p.items.indexOf(wardKey):-1;
        if(!ok&&pi>=0){p.items.splice(pi,1);ok=true;saved=true;}
        document.querySelectorAll("#qOpts .opt").forEach(x=>{x.disabled=true;if(x.dataset.ok==="true")x.classList.add("correct");});
        if(b.dataset.ok!=="true")b.classList.add("wrong");
        ok?Snd.right():Snd.wrong();
        p.cash=Math.max(0,p.cash+(ok?st.win:-st.lose));
        let extra="";
        if(saved){const w=G.items[wardKey];extra=`<div class="fact" style="border-color:var(--gold)"><b>${w.e} ${tx(w.n)}</b> — ${tx(w.d)}</div>`;}
        else if(ok&&Math.random()<.32){const g=giveItem(p);if(g)extra=`<div class="fact" style="border-color:var(--gold)"><b>${T("itemWon",g.e,tx(g.n))}</b> ${tx(g.d)} — ${tx(g.f)}</div>`;}
        log(ok?T("quizOkLog",p.name,fmt(st.win)):T("quizNoLog",p.name,fmt(st.lose)),ok?"good":"bad");
        const d=document.createElement("div");
        d.innerHTML=`<div class="fact"><b>${T("didYouKnow")}</b> ${tx(q.f)}</div>${extra}<div class="btnrow"><button class="btn" id="qGo">${T("continue")}</button></div>`;
        modalBox.appendChild(d);
        const gb=document.getElementById("qGo");gb.onclick=()=>{hideModal();res();};gb.focus();
        refreshPlayers();
      };
    });
  });
}
function shopStock(city){

  const k=Object.keys(G.items),out=[];
  for(let i=0;i<3;i++)out.push(k[(h+month*2+i*3)%k.length]);
  return [...new Set(out)];
}
